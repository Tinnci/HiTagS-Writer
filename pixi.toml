[workspace]
authors = ["Tinnci <Tinnci@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "hitags-writer"
platforms = ["osx-64", "osx-arm64", "linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
build = "ufbt"
launch = "ufbt launch"
clean = "ufbt -c"
lint = "sh -c 'PATH=$(find \"$HOME/.ufbt/toolchain\" -path \"*/bin\" -type d | head -n 1):$PATH python \"$HOME/.ufbt/current/scripts/lint.py\" check . \"!./refs\"'"
format = "sh -c 'PATH=$(find \"$HOME/.ufbt/toolchain\" -path \"*/bin\" -type d | head -n 1):$PATH python \"$HOME/.ufbt/current/scripts/lint.py\" format . \"!./refs\"'"
cdb = "ufbt cdb"
test = "sh -c 'cc -std=c11 -Itests/stubs -I. tests/test_em4100_decode.c em4100_encode.c -o /tmp/hitags_test_em4100_decode && /tmp/hitags_test_em4100_decode && cc -std=c11 -Itests/stubs -I. tests/test_dump_model.c -o /tmp/hitags_test_dump_model && /tmp/hitags_test_dump_model && cc -std=c11 -Itests/stubs -I. tests/test_codec.c hitag_s_codec.c -o /tmp/hitags_test_codec && /tmp/hitags_test_codec && cc -std=c11 -Itests/stubs -I. tests/test_config.c -o /tmp/hitags_test_config && /tmp/hitags_test_config && cc -std=c11 -Itests/stubs -I. tests/test_select_frame.c hitag_s_codec.c -o /tmp/hitags_test_select_frame && /tmp/hitags_test_select_frame && python -m unittest discover -s tests -p \"test_*.py\"'"
analyze-trace = "python analyze_trace.py"
sim-manchester = "python sim_manchester.py"
sim-mc4k = "python sim_mc4k_final.py"
sim-ui = "python sim_ui_layout.py"

[dependencies]
python = ">=3.11,<3.13"
pyserial = ">=3.5,<4"
colorlog = ">=6.9.0,<7"

[pypi-dependencies]
ufbt = "*"
